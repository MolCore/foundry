[project]
name = "rfd3_sym"
version = "0.1.0"
description = "Helical / screw symmetry overlay for RFD3 (RFdiffusion3)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ariel", email = "arielbs10@gmail.com" }]
dependencies = ["numpy"]
# NOTE: rfd3 (rc-foundry[rfd3]) and torch are runtime peer dependencies provided
# by the RFD3 environment; not pinned here so the overlay tracks the host install.

[project.optional-dependencies]
validation = ["gemmi", "biotite>=1.0"]
modal = ["modal"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rfd3_sym*"]
